# Based on the Microsoft Foundry C# Hosted Agent hello-world sample.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latino-net-hosted-agent
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  hello-agent:
    host: azure.ai.agent
    project: samples/hello-hosted-agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: hello-agent.dll
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: latino-net-hello
    displayName: LatinoNet Hello Agent
    description: Minimal Microsoft Agent Framework agent using the Foundry Responses protocol.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
