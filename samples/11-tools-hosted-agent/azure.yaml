# 11: proyecto azd independiente para la tool ficticia.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Alojar Responses usando la raiz publica como contexto de build.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-tools
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 11-tools-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-tools
    displayName: LatinoNet Tools
    description: Fictional workshop budget tool hosted with Responses.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
