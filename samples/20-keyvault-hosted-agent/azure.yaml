# 20: hosting con dependencias externas de vault y catalogo.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Inyectar configuracion; este archivo no crea vault, secreto, catalogo ni roles.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-keyvault
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 20-keyvault-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-keyvault
    displayName: LatinoNet Key Vault
    description: Backend-only external catalog credential from Key Vault.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      KEY_VAULT_URI: ${KEY_VAULT_URI}
      WORKSHOP_API_SECRET_NAME: ${WORKSHOP_API_SECRET_NAME}
      WORKSHOP_API_ENDPOINT: ${WORKSHOP_API_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
