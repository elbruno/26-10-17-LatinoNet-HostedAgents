# 24: hosting con exportacion a un recurso Application Insights existente.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Inyectar la conexion; no crear el recurso de telemetria ni certificar su ingesta.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-insights
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 24-application-insights-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-insights
    displayName: LatinoNet Application Insights
    description: Content-free agent and dependency traces exported to Azure Monitor.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
