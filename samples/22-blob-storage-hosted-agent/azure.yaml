# 22: hosting con un contenedor Blob externo autorizado.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Inyectar la URI sin SAS; no crear Storage ni conceder acceso.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-blobs
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 22-blob-storage-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-blobs
    displayName: LatinoNet Blob Storage
    description: Read-only bounded UTF-8 documents from an authorized container.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      BLOB_CONTAINER_URI: ${BLOB_CONTAINER_URI}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
