# 23: hosting del agente productor y configuracion de aprobacion.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Inyectar configuracion; no crear cola, permisos, persistencia ni ingreso de la API.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-jobs
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 23-service-bus-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-jobs
    displayName: LatinoNet Service Bus
    description: Propose work and send only through an authenticated application confirmation.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      SERVICE_BUS_NAMESPACE: ${SERVICE_BUS_NAMESPACE}
      SERVICE_BUS_QUEUE: ${SERVICE_BUS_QUEUE}
      JOB_APPROVAL_TOKEN: ${JOB_APPROVAL_TOKEN}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
