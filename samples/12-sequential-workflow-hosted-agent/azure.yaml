# 12: proyecto azd independiente para el workflow dentro de un proceso.
# A. Exigir herramientas compatibles.
# B. Declarar proyecto Foundry y deployment del modelo.
# C. Alojar Responses; el hosting no vuelve durable al workflow.
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: latinonet-workflow
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  agent:
    host: azure.ai.agent
    project: .
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: 12-sequential-workflow-hosted-agent.dll
    docker:
      path: Dockerfile
      context: ../..
      remoteBuild: true
    uses: [ai-project]
    kind: hosted
    name: latinonet-workflow
    displayName: LatinoNet Sequential Workflow
    description: In-process writer and reviewer workflow hosted with Responses.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
